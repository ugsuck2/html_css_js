<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        p { background-color: yellow; }
        span { background-color: green; }
    </style>
</head>
<body>
        
        <!-- 블록요소 vs 인라인요소 -->
        <!-- p 태그 span 태그 -->
        <p>첫번째 블록요소</p>
        <p>두번째 블록요소</p>
        <span>첫번째 인라인요소</span>
        <span>두번째 인라인요소</span>
        <span>세번째 인라인요소</span>
        <span>네번째 인라인요소</span>
        <span>다섯번째 인라인요소</span>
        <span>여섯번째 인라인요소</span>
        <span>일곱번째 인라인요소</span>
        <span>여덟번째 인라인요소</span>
        <span>아홉번째 인라인요소</span>
        <span>열번째 인라인요소</span>
        <span>열한번째 인라인요소</span>

</body>
</html>
