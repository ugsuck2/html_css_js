<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        /* css 작성 영역 */

        /* 전체 선택자*/
        * {
            color: gray;
        }
        /* 태그 선택자 */
        h2 {
            color: blue;
        }
        /* id 선택자 */
        #select-id {
            color: green;
        }
        /* class 선택자 */
        .select-class {
            color: purple;
            font-size: 60px;
        }
        /* 속성 선택자 */
        [href] {
            color: brown;
        }
        [target="_blank"] {
            color: red;
        }
        [target="_self"] {
            color: orange;
        }

    </style>
</head>
<body>
    <h1>h1</h1>
    <h2>h2</h2>
    <h3 id="select-id">h3</h3>
    <h4 class="select-class">h4</h4>
    <h5>h5</h5>

    <p>p 하나</p>
    <p class="select-class">p 둘</p>
    <p class="select-class">p 셋</p>
    <p class="select-class">p 넷</p>
    <ins style="font-size: 25px;"> 다섯여섯일곱여덟   </ins>
    <del>아홉열</del>

    <a href="https://www.naver.com" target="_blank">네이버로 이동</a>
    <a href="https://www.google.com" target="_self">구글로 이동</a>
    <h2 class="select-class">h2</h2>
    <h2 class="select-class">h2</h2>


</body>
</html>
