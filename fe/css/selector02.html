<head>

    <style>

    /* 그룹 선택자 "," */
    p, strong {
        color: red;
    }
    
    /* span {
        color: blue;
    } */
    /* 자식 선택자 ">" */
    /* div > p {
        color: green;
    }
    .top-div > p {
        color: orange;
    } */
    /* 하위 선택자 " "(공백) */
    /* .top-div p {
        color: green;
    }
    .top-div span {
        color: orange;
    } */

    /* 인접 형제 선택자 "+" */
    /* p에 바로 옆에 붙어있는 span */
    /* p + span {
        color: orange;
    } */
    /* 일반 형제 선택자 "~" */
    /* p ~ span {
        color: orange;
    } */
    /* p태그의 형제인 span 태그만 변경 */
    
    /* 가상 요소 선택자 ::before ::after */
    #vr-p::before {
        content: "***";
        color: aquamarine;
    }
    #vr-p::after {
        content: "###";
        color: rgb(127, 150, 255);
    }

    /* 가상 클래스 선택자 :first-child :last-child :nth-child() */
    a:link{ color: pink; }     
    a:visited{ color: goldenrod; }
    
    a:hover{ color: aqua
        ; }
    /* 마우스 올릴때 색깔 바뀌는 태그 */
    a:active{ color: rgba(89, 0, 255, 0.388); }

    input:focus {
        color: rgba(0, 255, 229, 0.908);
    }
    input:disabled {
        color: purple;
    }

    p:hover {
        color: orange;
    }

    .chk:checked + span {
        color: rgba(58, 0, 128, 0.868);
    }

    .chk:checked + label {
        color: green;
    }
    


    </style>



</head>
<body>


    <div class="top-div">

        <span>span1</span>

            <strong>strong</strong>
            <span>span3</span>
        </div>
